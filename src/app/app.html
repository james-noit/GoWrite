<div class="app-shell">
  <gowrite-header (openSettings)="openSettings($event)" (openAiSettings)="openSettings('ai')" />

  <!-- .app-main is the flex:1 wrapper (theme.css) that lets the editor card grow to fill the
  remaining viewport height below the header — the original React app had this as <main
  className="app-main" ref={containerRef}>; without it here, gowrite-editor-host just sizes to
  its own content and leaves the rest of the viewport blank. -->
  <main class="app-main">
    <gowrite-editor-host (openSummary)="summaryRequest.set($event)" />
  </main>
  <gowrite-mobile-support-button />

  <gowrite-settings-modal [open]="settingsOpen()" [initialTab]="settingsTab()" (closed)="closeSettings()" />
  <gowrite-summary-modal [request]="summaryRequest()" (closed)="closeSummary()" />
</div>
